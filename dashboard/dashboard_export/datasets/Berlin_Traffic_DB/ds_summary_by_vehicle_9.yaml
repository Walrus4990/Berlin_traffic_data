table_name: ds_summary_by_vehicle
main_dttm_col: date
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: berlin_traffic
schema: gold
sql: "SELECT\n  date,\n  mission_id,\n  streetnr,\n  'PKW (Auto)' AS fahrzeug,\n\
  \  SUM(car) AS gesamt,\n  ROUND(AVG(car)::numeric, 0) AS tagesdurchschnitt,\n  ROUND(AVG(v_car)::numeric,\
  \ 1) AS durchschnittsgeschwindigkeit\nFROM gold.dashboard\nGROUP BY date, mission_id,\
  \ streetnr\n\nUNION ALL\nSELECT date, mission_id, streetnr, 'Fahrrad',\n  SUM(bicycle),\n\
  \  ROUND(AVG(bicycle)::numeric, 0),\n  NULL\nFROM gold.dashboard GROUP BY date,\
  \ mission_id, streetnr\n\nUNION ALL\nSELECT date, mission_id, streetnr, 'LKW',\n\
  \  SUM(lorry),\n  ROUND(AVG(lorry)::numeric, 0),\n  ROUND(AVG(v_lorry)::numeric,\
  \ 1)\nFROM gold.dashboard GROUP BY date, mission_id, streetnr\n\nUNION ALL\nSELECT\
  \ date, mission_id, streetnr, 'Motorrad',\n  SUM(motorbike),\n  ROUND(AVG(motorbike)::numeric,\
  \ 0),\n  NULL\nFROM gold.dashboard GROUP BY date, mission_id, streetnr\n\nUNION\
  \ ALL\nSELECT date, mission_id, streetnr, 'Lieferwagen',\n  SUM(delivery_van),\n\
  \  ROUND(AVG(delivery_van)::numeric, 0),\n  NULL\nFROM gold.dashboard GROUP BY\
  \ date, mission_id, streetnr\n\nUNION ALL\nSELECT date, mission_id, streetnr, 'Sonstige',\n\
  \  SUM(other),\n  ROUND(AVG(other)::numeric, 0),\n  NULL\nFROM gold.dashboard GROUP\
  \ BY date, mission_id, streetnr"
