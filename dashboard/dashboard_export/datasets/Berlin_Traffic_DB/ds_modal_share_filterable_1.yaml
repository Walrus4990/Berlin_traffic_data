sql: "SELECT\n  date,\n  mission_id,\n  'PKW (Auto)' AS fahrzeug,\n  SUM(car) AS
  anzahl\nFROM gold.dashboard\nGROUP BY date, mission_id\n\nUNION ALL\nSELECT date,
  mission_id, 'Fahrrad', SUM(bicycle)\nFROM gold.dashboard GROUP BY date, mission_id\n\nUNION
  ALL\nSELECT date, mission_id, 'LKW', SUM(lorry)\nFROM gold.dashboard GROUP BY date,
  mission_id\n\nUNION ALL\nSELECT date, mission_id, 'Motorrad', SUM(motorbike)\nFROM
  gold.dashboard GROUP BY date, mission_id\n\nUNION ALL\nSELECT date, mission_id,
  'Lieferwagen', SUM(delivery_van)\nFROM gold.dashboard GROUP BY date, mission_id\n\nUNION
  ALL\nSELECT date, mission_id, 'Sonstige', SUM(other)\nFROM gold.dashboard GROUP
  BY date, mission_id"
