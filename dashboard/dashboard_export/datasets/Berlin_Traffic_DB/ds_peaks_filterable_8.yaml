sql: "SELECT\n  date,\n  mission_id,\n  hour,\n  ROUND(AVG(bicycle)::numeric, 0) AS avg_fahrrad,\n  ROUND(AVG(car)::numeric, 0) AS avg_pkw,\n  ROUND(AVG(lorry)::numeric, 0) AS avg_lkw,\n  ROUND(AVG(motorbike)::numeric, 0) AS avg_krad,\n  ROUND(AVG(delivery_van)::numeric, 0) AS avg_lieferwagen\nFROM gold.export\nGROUP BY date, mission_id, hour\nORDER BY hour ASC"
