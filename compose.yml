
x-common: &common           #anchor to avoid repeating restart and networks
  restart: on-failure
  networks:
    - traffic-net

services:

#-------------PostgreSQL traffic database
  postgres-traffic:
    <<: *common
    image: postgres:14
    environment:
      - POSTGRES_DB=$POSTGRES_TRAFFIC_DB
      - POSTGRES_PASSWORD=$POSTGRES_TRAFFIC_PASSWORD
      - POSTGRES_USER=$POSTGRES_TRAFFIC_USER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_TRAFFIC_USER -d $POSTGRES_TRAFFIC_DB"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-traffic-data:/var/lib/postgresql/data
      - ./sql/init/:/docker-entrypoint-initdb.d/
    ports:
      - "5431:5432" #check if I actually need this Docker services on the same network talk to each other, only add if i need to look at the data
    profiles: [local, full]

#-------------PostgreSQL data quality database
  postgres-dq:
    <<: *common
    image: postgres:14
    environment:
      - POSTGRES_DB=$POSTGRES_DQ_DB
      - POSTGRES_PASSWORD=$POSTGRES_DQ_PASSWORD
      - POSTGRES_USER=$POSTGRES_DQ_USER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_DQ_USER -d $POSTGRES_DQ_DB"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-data-quality:/var/lib/postgresql/data
      #- ./sql/init/:/docker-entrypoint-initdb.d/ DOES NOT EXIST YET; CAN WE SPECIFY SCHEMAS LATER?
    ports:
      - "5433:5432" #check if I actually need this Docker services on the same network talk to each other, only add if i need to look at the data
    profiles: [local, full]

#-------------PostgreSQL Airflow metadata
  postgres-airflow:
    <<: *common
    image: postgres:14
    environment:
      - POSTGRES_DB=$POSTGRES_AIRFLOW_DB
      - POSTGRES_PASSWORD=$POSTGRES_AIRFLOW_PASSWORD
      - POSTGRES_USER=$POSTGRES_AIRFLOW_USER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_AIRFLOW_USER -d $POSTGRES_AIRFLOW_DB"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    profiles: [full]

# ---------- Airflow
  airflow-init:
    image: apache/airflow:2.3.0
    networks:
    - traffic-net
    depends_on:
      postgres-airflow:
        condition: service_healthy    #better to add healthy condition for one shot initialisation
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://$POSTGRES_AIRFLOW_USER:$POSTGRES_AIRFLOW_PASSWORD@postgres-airflow:5432/$POSTGRES_AIRFLOW_DB
    command: |
      bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    profiles: [full]

  scheduler:
    <<: *common
    image: apache/airflow:2.3.0
    depends_on:
       airflow-init:
         condition: service_completed_successfully
       postgres-airflow:
         condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DEBUG__FAIL_FAST=true
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://$POSTGRES_AIRFLOW_USER:$POSTGRES_AIRFLOW_PASSWORD@postgres-airflow:5432/$POSTGRES_AIRFLOW_DB
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    command: scheduler
    volumes:
      - ./dags/:/opt/airflow/dags/
      #- ./logs:/opt/airflow/logs  #remove log bind in final prod
    tty: true
    stdin_open: true
    profiles: [full]

  webserver:  #this is for prod environment to check the DAG is running correctly, debug, troubleshoot etc. will not be run in final prod
    <<: *common
    image: apache/airflow:2.3.0
    depends_on:
      airflow-init:
         condition: service_completed_successfully
      postgres-airflow:
         condition: service_healthy
      scheduler:
         condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DEBUG__FAIL_FAST=true
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://$POSTGRES_AIRFLOW_USER:$POSTGRES_AIRFLOW_PASSWORD@postgres-airflow:5432/$POSTGRES_AIRFLOW_DB
      - POSTGRES_DB=$POSTGRES_AIRFLOW_DB
      - POSTGRES_PASSWORD=$POSTGRES_AIRFLOW_PASSWORD
      - POSTGRES_USER=airflow
    command: webserver
    volumes:
      - ./dags/:/opt/airflow/dags/
      #- ./logs:/opt/airflow/logs  #remove log bind in final prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    tty: true
    stdin_open: true
    profiles: [full]


# ---------- MinIO

  minio:
    <<: *common
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - MINIO_ROOT_USER=$MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    profiles: [full]


# -------- Superset
  superset:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      postgres-traffic:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - SUPERSET_SECRET_KEY=$SUPERSET_SECRET_KEY
    volumes:
      - superset-data:/app/superset_home
      - ./dashboard/:/app/superset_home/exports/
    ports:
      - "8089:8088"
    command: |
      bash -c "superset db upgrade && superset fab create-admin --username ${SUPERSET_ADMIN_USER} --firstname Admin --lastname Admin --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD} && superset init && superset run -h 0.0.0.0 -p 8088"
    profiles: [local, full]


volumes:
  postgres-traffic-data:
  postgres-data-quality:
  postgres-airflow-data:
  superset-data:
  minio-data:

networks:
  traffic-net:
    driver: bridge
