x-common: &common
  restart: unless-stopped
  networks:
    - traffic-net

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://api-server:8080/execution/'
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DEBUG__FAIL_FAST: "true"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  # # Traffic DB connection
  AIRFLOW_CONN_POSTGRES_TRAFFIC: postgresql://${POSTGRES_TRAFFIC_USER}:${POSTGRES_TRAFFIC_PASSWORD}@postgres-traffic:5432/${POSTGRES_TRAFFIC_DB}
  # # DQ DB connection
  AIRFLOW_CONN_POSTGRES_DQ: postgresql://${POSTGRES_DQ_USER}:${POSTGRES_DQ_PASSWORD}@postgres-dq:5432/${POSTGRES_DQ_DB}
  # MinIO
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  # External API
  DDWEB_EMAIL: ${DDWEB_EMAIL}
  DDWEB_PASSWORD: ${DDWEB_PASSWORD}
  # Superset
  SUPERSET_URL: ${SUPERSET_URL}
  SUPERSET_DASHBOARD_ZIP_PATH: ${SUPERSET_DASHBOARD_ZIP_PATH}
  SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
  # Pass access for Postgres to Supeset
  POSTGRES_TRAFFIC_USER: ${POSTGRES_TRAFFIC_USER}
  POSTGRES_TRAFFIC_PASSWORD: ${POSTGRES_TRAFFIC_PASSWORD}
  POSTGRES_TRAFFIC_DB: ${POSTGRES_TRAFFIC_DB}
  POSTGRES_TRAFFIC_HOST: ${POSTGRES_TRAFFIC_HOST}
  POSTGRES_TRAFFIC_PORT: ${POSTGRES_TRAFFIC_PORT}


x-airflow-volumes: &airflow-volumes
  - ./ts_traffic_initial_load_dag.py:/opt/airflow/dags/ts_traffic_initial_load_dag.py
  - ./ts_traffic_weekly_load_dag.py:/opt/airflow/dags/ts_traffic_weekly_load_dag.py
  - ./requirements.txt:/opt/airflow/dags/requirements.txt
  - ./etl/:/opt/airflow/etl/
  - ./utils/:/opt/airflow/utils/
  - ./tests/:/opt/airflow/tests/
  - ./sql/:/opt/airflow/sql/
  - ./data/:/opt/airflow/data/

x-airflow-build: &airflow-build
  build:
    context: .
    dockerfile: Dockerfile.airflow

services:
  # ---------- PostgreSQL: traffic
  postgres-traffic:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_TRAFFIC_DB}
      POSTGRES_PASSWORD: ${POSTGRES_TRAFFIC_PASSWORD}
      POSTGRES_USER: ${POSTGRES_TRAFFIC_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TRAFFIC_USER} -d ${POSTGRES_TRAFFIC_DB}"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-traffic-data:/var/lib/postgresql/data
      - ./sql/init/:/docker-entrypoint-initdb.d/
    ports:
      - "5431:5432"
    mem_limit: 2000m

  # ---------- PostgreSQL: data quality
  postgres-dq:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DQ_DB}
      POSTGRES_PASSWORD: ${POSTGRES_DQ_PASSWORD}
      POSTGRES_USER: ${POSTGRES_DQ_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DQ_USER} -d ${POSTGRES_DQ_DB}"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-data-quality:/var/lib/postgresql/data
      - ./sql/init_dq/:/docker-entrypoint-initdb.d/
    ports:
      - "5433:5432"

  # ---------- PostgreSQL: Airflow metadata
  postgres-airflow:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER} -d ${POSTGRES_AIRFLOW_DB}"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    mem_limit: 512m

  # ---------- Airflow init (one-shot)
  airflow-init:
    <<: *airflow-build
    networks:
      - traffic-net
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  # ----------Airflow DAG porcessor
  dag-processor:
    <<: [*common, *airflow-build]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    command: dag-processor
    volumes: *airflow-volumes

  # ---------- Airflow scheduler
  scheduler:
    <<: [*common, *airflow-build]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      dag-processor:
        condition: service_started
      postgres-airflow:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    command: scheduler
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 4000m

  # ---------- Airflow webserver
  api-server:
    <<: [*common, *airflow-build]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      dag-processor:
        condition: service_started
      postgres-airflow:
        condition: service_healthy
      scheduler:
        condition: service_started
    environment:
      <<: *airflow-common-env
    command: api-server
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    mem_limit: 1000m

  # ---------- MinIO
  minio:
    <<: *common
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  # ---------- Superset
  superset:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      postgres-traffic:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - superset-data:/app/superset_home
      - ./dashboard/:/app/superset_home/exports/
    ports:
      - "8089:8088"
    command: bash -c "superset db upgrade && superset fab create-admin --username ${SUPERSET_ADMIN_USER} --firstname Admin --lastname Admin --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD} && superset init && superset run -h 0.0.0.0 -p 8088"

volumes:
  postgres-traffic-data:
  postgres-data-quality:
  postgres-airflow-data:
  superset-data:
  minio-data:

networks:
  traffic-net:
    driver: bridge
